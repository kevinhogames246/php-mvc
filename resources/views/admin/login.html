<div class="d-flex junstify-content-center">
    <div class="card mt-3 text-dark text-center">
        <div class='card-header'>
            <h1>Login</h1>
        </div>
        <div class='card-body'>
            {{status}}
            <form method="post">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" name="email" placeholder="'email@teste.com" required
                        autofocus>
                </div>
                <div class="form-group my-3">
                    <label for="password">Senha</label>
                    <input type="password" class="form-control" name="senha" required>
                </div>
                <select name="contexto">
                    <option value="atualizador">Atualizador de Arquivos</option>
                    <option value="admin">Administração</option>
                </select>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>
