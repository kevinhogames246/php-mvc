<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">{{error}} - ({{code}})</h3>
        </div>
        <div class="card-body">
            <h4 class="text-danger">{{message}}</h4>
            <hr>
            <p class="text-muted">Se você acredita que isso é um erro, entre em contato com o administrador.</p>
            <a href="{{url_home}}" class="btn btn-primary">Voltar ao Início</a>
        </div>
    </div>
</div>
